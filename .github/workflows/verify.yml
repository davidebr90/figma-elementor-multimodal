name: FEM source verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  wordpress:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/wordpress-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring
      - run: composer install --no-interaction --prefer-dist
      - run: php vendor/bin/phpunit -c phpunit.xml.dist
      - run: php vendor/bin/phpstan analyse --configuration=phpstan.neon --memory-limit=1536M
      - run: php vendor/bin/phpcs --standard=phpcs.xml.dist

  wordpress-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: packages/wordpress-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, mysqli
      - run: composer install --no-interaction --prefer-dist
      - name: Install WordPress test library
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/wp-cli/scaffold-command/8ad932fce7be1112707c7ac119f6f828cca075d4/templates/install-wp-tests.sh --output /tmp/install-wp-tests.sh
          bash /tmp/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 latest
      - name: Run real WordPress database migration test
        env:
          FEM_WP_TESTS_DIR: ${{ github.workspace }}/packages/wordpress-plugin/tests
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: php vendor/bin/phpunit -c phpunit.xml.dist tests/Integration/WordPressMigrationTest.php

  figma-and-blocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/block-validation/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring
      - run: composer install --no-interaction --prefer-dist
        working-directory: packages/wordpress-plugin
      - run: npm ci
        working-directory: packages/figma-plugin
      - run: npm test
        working-directory: packages/figma-plugin
      - run: node --check src/code.js
        working-directory: packages/figma-plugin
      - run: npm ci
        working-directory: tools/block-validation
      - run: npm test
        working-directory: tools/block-validation
